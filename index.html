    window.handleScoreCardUpload = async function(event) {
      const file = event.target.files[0];
      if (!file) return;
      event.target.value = '';

      const apiKey = getClaudeApiKey();

      if (!apiKey) {
        alert('❌ API Key가 설정되지 않았습니다.\n\n설정(⚙️) → 스코어카드 분석(Claude AI) → API Key 설정에서 입력해 주세요.');
        return;
      }

      document.getElementById('upload-loading').classList.add('active');

      try {
        // ✅ 이미지 자동 최적화(리사이즈 + JPEG 변환) 후 전송
        const prepared = await fileToBase64(file);
        const base64Data = prepared.base64Data;
        const mimeType = prepared.mimeType;

        const extractedData = await callClaudeVision(apiKey, base64Data, mimeType);
        fillCourseFromAI(extractedData);

      } catch (error) {
        console.error('Scorecard error:', error);
        alert('❌ 스코어카드 처리 실패:\n' + (error && error.message ? error.message : String(error)));
      } finally {
        document.getElementById('upload-loading').classList.remove('active');
      }
    };

    
    // ========================================
    // SCORECARD IMAGE PREP (resize + JPEG encode)
    // ========================================
    // 반환: { base64Data, mimeType }
    // - base64Data는 'data:image/..;base64,' 접두사 없는 순수 Base64 문자열
    // - mimeType은 서버로 전달할 MIME (기본 image/jpeg)
    async function fileToBase64(file) {
      const MAX_DIM = 2000;     // 긴 변 기준 최대 px
      const JPEG_QUALITY = 0.82;

      // HEIC/HEIF 안내 (일부 브라우저/서버에서 처리 불가)
      const type = (file && file.type ? String(file.type) : '').toLowerCase();
      const isHeic = type.includes('heic') || type.includes('heif');

      // 작은 JPEG/PNG는 그대로 보내도 무방 (불필요한 재인코딩 방지)
      try {
        if (!isHeic && file && file.size && file.size <= 900 * 1024 && (type === 'image/jpeg' || type === 'image/png' || type === 'image/webp')) {
          const base64DataRaw = await _readFileAsBase64(file);
          return { base64Data: base64DataRaw, mimeType: (type || 'image/jpeg') };
        }
      } catch (_) {
        // 아래에서 재시도
      }

      // ✅ 이미지 디코딩 → 캔버스 리사이즈 → JPEG로 재인코딩
      let bitmap = null;
      try {
        if ('createImageBitmap' in window) {
          bitmap = await createImageBitmap(file);
        } else {
          // createImageBitmap 미지원 브라우저 fallback
          const dataUrl = await _readFileAsDataUrl(file);
          const img = await _loadImage(dataUrl);
          bitmap = img;
        }
      } catch (e) {
        if (isHeic) {
          throw new Error('HEIC(아이폰 사진) 형식으로 보입니다.\n\n해결 방법:\n1) 사진을 "스크린샷"으로 저장(JPEG/PNG) 후 업로드\n또는\n2) iPhone 설정 > 카메라 > 포맷 > "호환성 우선"으로 변경 후 다시 촬영\n\n원인: 이 브라우저/서버 조합에서 HEIC를 처리하지 못할 수 있습니다.');
        }
        throw new Error('이미지 파일을 열 수 없습니다.\n파일 형식/손상 여부를 확인 후 다시 시도해 주세요.');
      }

      const srcW = bitmap.width || bitmap.naturalWidth || 0;
      const srcH = bitmap.height || bitmap.naturalHeight || 0;
      if (!srcW || !srcH) {
        throw new Error('이미지 크기를 확인할 수 없습니다. 다른 이미지로 다시 시도해 주세요.');
      }

      const scale = Math.min(1, MAX_DIM / Math.max(srcW, srcH));
      const outW = Math.max(1, Math.round(srcW * scale));
      const outH = Math.max(1, Math.round(srcH * scale));

      const canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;

      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) throw new Error('브라우저에서 이미지 변환을 지원하지 않습니다.');
      ctx.drawImage(bitmap, 0, 0, outW, outH);

      // 메모리 정리
      try { if (bitmap && bitmap.close) bitmap.close(); } catch (_) {}

      const blob = await _canvasToBlob(canvas, 'image/jpeg', JPEG_QUALITY);
      const base64Data = await _readBlobAsBase64(blob);

      return { base64Data, mimeType: 'image/jpeg' };
    }

    function _readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
        reader.readAsDataURL(file);
      });
    }

    function _readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const s = String(reader.result || '');
          const idx = s.indexOf(',');
          resolve(idx >= 0 ? s.slice(idx + 1) : s);
        };
        reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
        reader.readAsDataURL(file);
      });
    }

    function _loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('이미지를 불러올 수 없습니다.'));
        img.src = src;
      });
    }

    function _canvasToBlob(canvas, mime, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) return reject(new Error('이미지 변환에 실패했습니다.'));
          resolve(blob);
        }, mime, quality);
      });
    }

    function _readBlobAsBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const s = String(reader.result || '');
          const idx = s.indexOf(',');
          resolve(idx >= 0 ? s.slice(idx + 1) : s);
        };
        reader.onerror = () => reject(new Error('이미지 변환 결과를 읽을 수 없습니다.'));
        reader.readAsDataURL(blob);
      });
    }

    async function callClaudeVision(apiKey, base64Data, mimeType) {
      const TIMEOUT_MS = 60000; // Claude Vision은 좀 더 시간 필요
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), TIMEOUT_MS);

      const systemPrompt = `You are a golf scorecard analyzer. Extract course information from the scorecard image and return ONLY a valid JSON object (no markdown, no backticks, no explanation).

Required JSON format:
{
  "name": "Course Name",
  "location": "Location (city/region)",
  "holes": 18,
  "par": [4,3,5,4,4,3,5,4,4, 4,3,5,4,4,3,5,4,4],
  "distances_blue": [380,170,520,400,350,190,530,410,360, 390,165,510,405,345,185,525,415,355],
  "distances_white": [360,155,500,380,330,175,510,390,340, 370,150,490,385,325,170,505,395,335],
  "stroke_index": [7,15,3,1,11,17,5,9,13, 8,16,4,2,12,18,6,10,14]
}

Rules:
- "par" array: par value for each hole (3, 4, or 5)
- "distances_blue": blue/back tee distances in meters (or yards as shown)
- "distances_white": white/front tee distances in meters (or yards as shown)
- "stroke_index": handicap stroke index for each hole (1-18)
- If 9-hole course, set "holes": 9 and arrays should have 9 elements
- If a value is unreadable, use 0 for distances and 4 for par
- For stroke_index, if labeled as "handicap", "hcp", "hdcp", or "index", extract those values
- Return ONLY the JSON object, nothing else`;

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 2048,
            system: systemPrompt,
            messages: [{
              role: 'user',
              content: [
                {
                  type: 'image',
                  source: {
                    type: 'base64',
                    media_type: mimeType || 'image/jpeg',
                    data: base64Data
                  }
                },
                {
                  type: 'text',
                  text: '이 스코어카드에서 코스 정보를 추출해서 JSON으로 반환해 주세요.'
                }
              ]
            }]
          }),
          signal: controller.signal
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.error?.message || '';

          if (response.status === 401) {
            throw new Error('API Key가 유효하지 않습니다.\n\n설정(⚙️) → API Key 설정에서 올바른 키를 입력해 주세요.');
          }
          if (response.status === 429) {
            throw new Error('API 요청 한도 초과입니다.\n잠시 후 다시 시도해 주세요.');
          }
          if (response.status === 413 || errMsg.includes('too large')) {
            throw new Error('이미지가 너무 큽니다.\n스코어카드를 꽉 차게 촬영하거나 해상도를 낮춰 주세요.');
          }
          throw new Error('Claude API 오류: ' + response.status + '\n' + errMsg);
        }

        const result = await response.json();

        // Claude 응답에서 텍스트 추출
        const textContent = result.content
          .filter(c => c.type === 'text')
          .map(c => c.text)
          .join('');

        // JSON 파싱 (마크다운 코드블록 제거)
        const cleaned = textContent
          .replace(/```json\s*/gi, '')
          .replace(/```\s*/g, '')
          .trim();

        let parsed;
        try {
          parsed = JSON.parse(cleaned);
        } catch (parseErr) {
          // JSON 부분만 추출 시도
          const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            parsed = JSON.parse(jsonMatch[0]);
          } else {
            throw new Error('AI 응답을 JSON으로 파싱할 수 없습니다.\n다른 이미지로 다시 시도해 주세요.\n\n응답: ' + cleaned.slice(0, 200));
          }
        }

        return parsed;

      } catch (e) {
        if (e && e.name === 'AbortError') {
          throw new Error('Claude API 응답이 지연되어 중단했습니다. (60초)\n\n네트워크 상태를 확인 후 다시 시도해 주세요.');
        }
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

function fillCourseFromAI(data) {
  const holes = data.holes || 18;
  let par = data.par || [];
  let distBlue = data.distances_blue || [];
  let distWhite = data.distances_white || [];

  // ✅ Stroke Index(또는 Handicap 열) 후보 키들
  const rawIdx =
    data.stroke_index ??
    data.strokeIndex ??
    data.stroke_index_mens ??
    data.index ??
    data.mens_index ??
    data.mensIndex ??
    data.mens_hcp ??
    data.mensHcp ??
    data.mens_hdcp ??
    data.mensHdcp ??
    data.handicap ??
    data.hcp ??
    data.hdc ??
    data.hdcp ??
    data.mens_handicap ??
    data.mensHandicap ??
    [];

  // ✅ 다양한 형태(배열/문자열/객체 out+in)를 1개의 배열로 정규화
  let strokeIdx = [];
  if (Array.isArray(rawIdx)) {
    strokeIdx = rawIdx;
  } else if (rawIdx && typeof rawIdx === 'object') {
    // 예: { out:[...], in:[...] } 또는 { front9:[...], back9:[...] }
    const outArr = rawIdx.out || rawIdx.front9 || rawIdx.front_9 || rawIdx.out9 || rawIdx.out_9 || [];
    const inArr = rawIdx.in || rawIdx.back9 || rawIdx.back_9 || rawIdx.in9 || rawIdx.in_9 || [];
    if (Array.isArray(outArr) || Array.isArray(inArr)) {
      strokeIdx = []
        .concat(Array.isArray(outArr) ? outArr : [])
        .concat(Array.isArray(inArr) ? inArr : []);
    }
  } else if (typeof rawIdx === 'string') {
    // 예: "5,11,7,15,1,..." 또는 "5 11 7 ..."
    const nums = rawIdx.match(/\d+/g);
    strokeIdx = nums ? nums.map(n => parseInt(n, 10)) : [];
  }

  // 길이 보정(기본값 적용)
  while (par.length < holes) par.push(4);
  while (distBlue.length < holes) distBlue.push(0);
  while (distWhite.length < holes) distWhite.push(0);
  if (!Array.isArray(strokeIdx)) strokeIdx = [];
  while (strokeIdx.length < holes) strokeIdx.push(strokeIdx.length + 1);

  appState.newCourse = {
    id: 'course_' + Date.now(),
    name: data.name || '',
    location: data.location || '',
    holes: holes,
    par: par.slice(0, holes),
    strokeIndex: strokeIdx.slice(0, holes),
    distances: {
      blue: distBlue.slice(0, holes),
      white: distWhite.slice(0, holes)
    }
  };
  appState.showCourseModal = true;
  render();
}

    // ========================================
    // SCORECARD SHORTCUTS (Round Start)
    // ========================================
    window.triggerScorecardCamera = function() {
      const el = document.getElementById('scorecard-camera');
      if (el) el.click();
      else alert('카메라 입력 요소를 찾을 수 없습니다.');
    };

    window.triggerScorecardGallery = function() {
      const el = document.getElementById('scorecard-upload');
      if (el) el.click();
      else alert('갤러리 입력 요소를 찾을 수 없습니다.');

    // ========================================
    // AUTO-SAVE & RECOVERY
    // ========================================
    function autoSaveProgress() {
      if (appState.activeRound) {
        try {
          const saveData = {
            activeRound: appState.activeRound,
            currentHole: appState.currentHole,
            holePar: appState.holePar,
            holeDistance: appState.holeDistance,
            shots: appState.shots,
            currentShot: appState.currentShot,
            puttingData: appState.puttingData,
            selectedTeeBox: appState.selectedTeeBox,
            timestamp: Date.now()
          };
          localStorage.setItem('golf_temp_round', JSON.stringify(saveData));
          console.log('✅ 진행상황 자동 저장됨');
        } catch (e) {
          console.error('자동 저장 실패:', e);
        }
      }
    }

    function checkForRecovery() {
      try {
        const temp = localStorage.getItem('golf_temp_round');
        if (temp) {
          const saved = JSON.parse(temp);
          const savedTime = new Date(saved.timestamp);
          const now = new Date();
          const hoursDiff = (now - savedTime) / (1000 * 60 * 60);
          
          // 24시간 이내의 데이터만 복구 제안
          if (hoursDiff < 24) {
            appState.recoveryData = saved;
            appState.showRecoveryModal = true;
            console.log('🔄 복구 가능한 라운드 발견:', saved);
          } else {
            // 오래된 데이터는 삭제
            localStorage.removeItem('golf_temp_round');
            console.log('⏰ 오래된 임시 저장 데이터 삭제');
          }
        }
      } catch (e) {
        console.error('복구 확인 실패:', e);
      }
    }

    window.resumeRound = function() {
      const saved = appState.recoveryData;
      if (saved) {
        // 저장된 상태 완전 복원
        appState.activeRound = saved.activeRound;
        appState.currentHole = saved.currentHole;
        appState.holePar = saved.holePar;
        appState.holeDistance = saved.holeDistance;
        appState.shots = saved.shots || [];
        appState.currentShot = saved.currentShot;
        appState.puttingData = saved.puttingData;
        appState.selectedTeeBox = saved.selectedTeeBox;
        
        // 라운드 페이지로 이동
        appState.currentPage = 0;
        appState.showRecoveryModal = false;
        appState.recoveryData = null;
        
        render();
        console.log('✅ 라운드 복구 완료');
      }
    };

    window.discardRecovery = function() {
      localStorage.removeItem('golf_temp_round');
      appState.showRecoveryModal = false;
      appState.recoveryData = null;
      render();
      console.log('❌ 복구 취소됨');
    };

    // ========================================
    // BROWSER BACK BUTTON PREVENTION
    // ========================================
    function preventBackButton() {
      // 라운드 진행 중일 때만 뒤로가기 차단
      if (appState.activeRound) {
        history.pushState(null, '', location.href);
      }
    }

    window.addEventListener('popstate', function() {
      if (appState.activeRound) {
        // 뒤로가기 막기
        history.pushState(null, '', location.href);
        alert('⚠️ 라운드 진행 중입니다.\n\n종료하려면 "라운드 종료" 버튼을 사용하세요.');
        console.log('🚫 뒤로가기 차단됨 (라운드 진행 중)');
      }
    });

    // 페이지 나갈 때 경고
    window.addEventListener('beforeunload', function(e) {
      if (appState.activeRound) {
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
    });

    // ========================================
    // BOOT
    // ========================================
    window.addEventListener('DOMContentLoaded', () => {
      try { loadData(); } catch (e) { console.error('Initial loadData failed:', e); }
      try { loadCustomClubs(); } catch (e) { console.error('Custom clubs load failed:', e); }
      try { updateClubDistancesFromRounds(); } catch (e) { console.error('Club distance learning failed:', e); }
      try { checkForRecovery(); } catch (e) { console.error('Recovery check failed:', e); }
      try { render(); } catch (e) { console.error('Initial render failed:', e); }
      try { preventBackButton(); } catch (e) { console.error('Back button prevention failed:', e); }
    });
