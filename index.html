<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a3a0f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <title>Golf Analyzer ⛳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-dark:   #1a3a0f;
      --green:        #2d5c18;
      --green-mid:    #3d7a22;
      --green-light:  #6aaa3a;
      --green-pale:   #d4edbc;
      --cream:        #f7f3ec;
      --sand:         #e8dfc8;
      --sand-dark:    #cfc3a8;
      --brown:        #4a3a28;
      --brown-light:  #7a6a55;
      --red:          #c0392b;
      --red-light:    #f5b7b1;
      --blue:         #2471a3;
      --blue-light:   #aed6f1;
      --gold:         #d4a017;
      --white:        #ffffff;
      --nav-h:        64px;
      --header-h:     56px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--cream);
      color: var(--brown);
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--cream);
    }

    /* ── PAGES ── */
    .page {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px calc(var(--nav-h) + 16px);
      -webkit-overflow-scrolling: touch;
    }
    .page.no-nav { padding-bottom: 16px; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: var(--nav-h);
      background: var(--green-dark);
      display: flex;
      border-top: 2px solid var(--green);
      z-index: 100;
    }
    .nav-btn {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      border: none; background: none; cursor: pointer;
      color: var(--green-pale); opacity: 0.55;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 10px; font-weight: 500;
      transition: opacity 0.15s;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-btn .nav-icon { font-size: 22px; line-height: 1; }
    .nav-btn.active { opacity: 1; }

    /* ── TYPOGRAPHY ── */
    .page-title {
      font-size: 22px; font-weight: 900;
      color: var(--green-dark);
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    .section-title {
      font-size: 13px; font-weight: 700;
      color: var(--brown-light);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    /* ── CARDS / SECTIONS ── */
    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .card-dark {
      background: var(--green-dark);
      color: var(--white);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    /* ── BUTTONS ── */
    .btn-primary {
      width: 100%;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.3px;
    }
    .btn-primary:active { background: var(--green-dark); transform: scale(0.98); }

    .btn-secondary {
      width: 100%;
      background: var(--sand);
      color: var(--brown);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 8px;
    }
    .btn-secondary:active { background: var(--sand-dark); }

    .btn-ghost {
      background: none;
      border: 2px solid var(--sand-dark);
      border-radius: 12px;
      padding: 10px 16px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px; font-weight: 600;
      color: var(--brown);
      cursor: pointer;
    }
    .btn-ghost:active { background: var(--sand); }

    /* ── CHOICE BUTTONS ── */
    .choice-row {
      display: flex; gap: 8px;
      margin-bottom: 4px;
    }
    .choice-btn {
      flex: 1;
      padding: 12px 6px;
      border: 2px solid var(--sand-dark);
      border-radius: 12px;
      background: var(--white);
      color: var(--brown);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
    }
    .choice-btn.selected {
      border-color: var(--green);
      background: var(--green-pale);
      color: var(--green-dark);
    }
    .choice-btn:active { transform: scale(0.97); }

    /* ── INPUTS ── */
    .input-label {
      font-size: 12px; font-weight: 700;
      color: var(--brown-light);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      display: block;
    }
    .text-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--sand-dark);
      border-radius: 12px;
      background: var(--white);
      color: var(--brown);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    .text-input:focus { border-color: var(--green); }

    /* ── NUMBER STEPPER ── */
    .stepper {
      display: flex; align-items: center;
      gap: 0;
      background: var(--sand);
      border-radius: 14px;
      overflow: hidden;
    }
    .stepper-btn {
      width: 52px; height: 52px;
      border: none; background: none;
      font-size: 24px; font-weight: 300;
      color: var(--brown);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
      flex-shrink: 0;
    }
    .stepper-btn:active { background: var(--sand-dark); }
    .stepper-val {
      flex: 1;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 28px; font-weight: 500;
      color: var(--green-dark);
      line-height: 52px;
    }

    /* ── SCORE BADGE ── */
    .score-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 700;
      font-family: 'DM Mono', monospace;
    }
    .chip-eagle { background: #fdebd0; color: #d35400; }
    .chip-birdie { background: #d5f5e3; color: #1e8449; }
    .chip-par { background: #eaf2fb; color: #2471a3; }
    .chip-bogey { background: #fef9e7; color: #b7950b; }
    .chip-double { background: #fdedec; color: #c0392b; }
    .chip-triple { background: #c0392b; color: white; }

    /* ── STAT GRID ── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-card {
      background: var(--white);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .stat-val {
      font-family: 'DM Mono', monospace;
      font-size: 26px; font-weight: 500;
      color: var(--green-dark);
      line-height: 1.1;
    }
    .stat-lbl {
      font-size: 11px; font-weight: 600;
      color: var(--brown-light);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-sub {
      font-size: 10px;
      color: var(--sand-dark);
      margin-top: 2px;
    }

    /* ── ROW LIST ── */
    .row-list { }
    .row-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--sand);
    }
    .row-item:last-child { border-bottom: none; }
    .row-label { font-size: 14px; font-weight: 500; color: var(--brown); }
    .row-value { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--green-dark); }

    /* ── HOLE HEADER (라운드 중) ── */
    .hole-header {
      background: var(--green-dark);
      color: var(--white);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hole-num-big {
      font-size: 36px; font-weight: 900;
      font-family: 'DM Mono', monospace;
      line-height: 1;
    }
    .hole-meta { font-size: 13px; opacity: 0.75; margin-top: 2px; }
    .hole-score-live {
      text-align: right;
      font-family: 'DM Mono', monospace;
    }
    .hole-score-num { font-size: 28px; font-weight: 500; }
    .hole-score-lbl { font-size: 11px; opacity: 0.7; }

    /* ── CLUB RECOMMEND ── */
    .club-recommend {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-mid) 100%);
      color: var(--white);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .club-rec-title { font-size: 11px; font-weight: 700; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
    .club-rec-name { font-size: 28px; font-weight: 900; margin: 4px 0 2px; }
    .club-rec-dist { font-size: 13px; opacity: 0.85; }
    .club-feedback-row {
      display: flex; gap: 8px; margin-top: 10px;
    }
    .club-fb-btn {
      flex: 1; padding: 9px 4px;
      border: none; border-radius: 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .club-fb-btn:active { transform: scale(0.95); }
    .fb-short { background: #fdebd0; color: #d35400; }
    .fb-ok    { background: #d5f5e3; color: #1e8449; }
    .fb-long  { background: #aed6f1; color: #1a5276; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 200;
    }
    .modal-sheet {
      background: var(--white);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      width: 100%; max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: var(--sand-dark);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 20px; font-weight: 900;
      color: var(--green-dark);
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── HOME PAGE ── */
    .home-hero {
      background: var(--green-dark);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 16px;
      color: var(--white);
    }
    .home-hero-title {
      font-size: 13px; font-weight: 700;
      opacity: 0.7; text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .home-score-big {
      font-family: 'DM Mono', monospace;
      font-size: 56px; font-weight: 500;
      line-height: 1;
    }
    .home-score-par { font-size: 16px; opacity: 0.75; margin-top: 4px; }
    .home-round-meta { font-size: 12px; opacity: 0.55; margin-top: 8px; }

    /* ── HISTORY LIST ── */
    .history-item {
      background: var(--white);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .history-item:active { transform: scale(0.98); }
    .history-date { font-size: 11px; color: var(--brown-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .history-course { font-size: 15px; font-weight: 700; color: var(--brown); margin: 2px 0; }
    .history-scores { display: flex; gap: 12px; margin-top: 6px; }
    .history-score-item { font-size: 12px; color: var(--brown-light); }
    .history-score-item b { color: var(--green-dark); font-family: 'DM Mono', monospace; }

    /* ── PROGRESS BAR ── */
    .progress-bar {
      height: 6px; background: var(--sand);
      border-radius: 3px; overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%; background: var(--green-light);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--brown-light);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-msg { font-size: 15px; line-height: 1.6; }

    /* ── TREND CHART ── */
    .trend-chart { padding: 8px 0; }
    .trend-dots {
      display: flex; align-items: flex-end;
      gap: 6px; height: 80px;
      padding: 0 4px;
    }
    .trend-dot-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .trend-dot {
      width: 8px; height: 8px;
      background: var(--green-light);
      border-radius: 50%;
      margin-bottom: 4px;
    }
    .trend-dot.best { background: var(--gold); }
    .trend-lbl { font-size: 9px; color: var(--brown-light); font-family: 'DM Mono', monospace; }

    /* ── LOADING ── */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(26,58,15,0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 300; color: white;
      gap: 16px;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SCORECARD BOX ── */
    .scorecard-box {
      background: var(--green-dark);
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
    }
    .scorecard-box-title {
      color: var(--green-pale);
      font-size: 13px; font-weight: 700;
      margin-bottom: 10px;
    }
    .scorecard-box-help {
      color: rgba(255,255,255,0.65);
      font-size: 12px; line-height: 1.6;
      margin-bottom: 12px;
    }
    .scorecard-btn-row { display: flex; gap: 8px; }
    .scorecard-btn {
      flex: 1; padding: 12px;
      border: none; border-radius: 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; font-weight: 700;
      cursor: pointer;
    }
    .scorecard-btn-dark { background: var(--green-mid); color: white; }
    .scorecard-btn-light { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }

    /* ── SETTINGS ── */
    .club-row {
      display: grid;
      grid-template-columns: 90px 1fr 1fr;
      gap: 6px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--sand);
    }
    .club-row:last-child { border-bottom: none; }
    .club-name-lbl { font-size: 13px; font-weight: 600; color: var(--brown); }
    .num-input {
      padding: 8px;
      border: 1.5px solid var(--sand-dark);
      border-radius: 8px;
      background: var(--white);
      font-family: 'DM Mono', monospace;
      font-size: 14px; text-align: center;
      color: var(--brown);
      width: 100%;
    }
    .num-input:focus { outline: none; border-color: var(--green); }

    /* ── CORRECTION BADGE (클럽 보정) ── */
    .correction-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px; font-weight: 700;
      margin-left: 6px;
    }
    .corr-up   { background: #aed6f1; color: #1a5276; }
    .corr-down { background: #fdebd0; color: #d35400; }
    .corr-ok   { background: #d5f5e3; color: #1e8449; }

    /* ── SCORE DISTRIBUTION BAR ── */
    .dist-row { margin-bottom: 8px; }
    .dist-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
    .dist-bar { height: 10px; background: var(--sand); border-radius: 5px; overflow: hidden; }
    .dist-fill { height: 100%; border-radius: 5px; transition: width 0.4s; }

    /* ── CADDIE PANEL ── */
    .caddie-panel {
      background: var(--green-dark);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      color: var(--white);
    }
    .caddie-title {
      font-size: 11px; font-weight: 700;
      opacity: 0.65; text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .caddie-club-name {
      font-size: 40px; font-weight: 900;
      line-height: 1; margin-bottom: 4px;
      letter-spacing: -1px;
    }
    .caddie-target-dist {
      font-family: 'DM Mono', monospace;
      font-size: 15px; opacity: 0.85;
      margin-bottom: 14px;
    }
    .caddie-breakdown {
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .caddie-breakdown-row {
      display: flex; justify-content: space-between;
      font-size: 12px; padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .caddie-breakdown-row:last-child { border-bottom: none; }
    .caddie-breakdown-row .lbl { opacity: 0.7; }
    .caddie-breakdown-row .val { font-family: 'DM Mono', monospace; font-weight: 600; }
    .caddie-breakdown-row .val.pos { color: #f0a500; }
    .caddie-breakdown-row .val.neg { color: #7ec8e3; }
    .caddie-breakdown-row .val.total { color: #a8e06a; font-size: 13px; }

    .caddie-warning {
      background: rgba(192,57,43,0.85);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px; line-height: 1.5;
      margin-bottom: 12px;
    }
    .caddie-safe {
      background: rgba(46,139,87,0.5);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px; line-height: 1.5;
      margin-bottom: 12px;
    }

    /* 조건 입력 토글 버튼들 */
    .condition-toggles {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .cond-toggle {
      padding: 7px 12px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.75);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.15s;
    }
    .cond-toggle.active {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.6);
      color: white;
    }

    .cond-panel {
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .cond-panel-title {
      font-size: 11px; font-weight: 700;
      opacity: 0.6; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .cond-btn-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .cond-btn {
      flex: 1; min-width: 60px;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.75);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      text-align: center;
      transition: all 0.12s;
    }
    .cond-btn.selected {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.7);
      color: white;
    }
    .cond-btn:active { transform: scale(0.95); }

    /* 피드백 버튼 */
    .fb-row { display: flex; gap: 6px; }
    .fb-btn {
      flex: 1; padding: 10px 4px;
      border: none; border-radius: 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px; font-weight: 700;
      cursor: pointer; text-align: center;
      transition: transform 0.1s, opacity 0.1s;
    }
    .fb-btn:active { transform: scale(0.95); }
    .fb-btn.fb-short { background: #fdebd0; color: #d35400; }
    .fb-btn.fb-ok    { background: #d5f5e3; color: #1e8449; }
    .fb-btn.fb-long  { background: #aed6f1; color: #1a5276; }
    .fb-btn.fb-selected { outline: 2px solid white; }

    /* ── UTIL ── */
    .mt-8  { margin-top: 8px; }

<script>

  '5iron':{ carry:152, total:165 }, '6iron':{ carry:142, total:154 },
  '7iron':{ carry:132, total:143 }, '8iron':{ carry:122, total:132 },
  '9iron':{ carry:112, total:121 }, pw:{ carry:102, total:110 },

const STORAGE_KEY = 'golfAnalyzerV12';

const LEARN_KEY   = 'golf_learning_v12';

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════

let CLUBS     = JSON.parse(JSON.stringify(DEFAULT_CLUBS));
let DISTANCES = JSON.parse(JSON.stringify(DEFAULT_DISTANCES));

// 클럽 피드백 학습 데이터: { clubId: { short:0, ok:0, long:0 } }
let LEARNING = {};

const S = {
  page: 0,        // 0=홈 1=라운드시작 2=통계 3=히스토리 4=설정

    gir: null,       // true|false|null

  },

  modalData: {},

// ════════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════════

function saveData() {

}

        if (!c.strokeIndex || !c.strokeIndex.length)
          c.strokeIndex = Array.from({length: c.holes||18}, (_,i) => i+1);
      });

}
function saveClubs() {
  try { localStorage.setItem(CLUBS_KEY, JSON.stringify(CLUBS)); } catch(e) {}
  try { localStorage.setItem(DIST_KEY, JSON.stringify(DISTANCES)); } catch(e) {}
}

}

}
function getClaudeKey() {

}

// ════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toInt(v) { const n=parseInt(v,10); return isFinite(n)?n:null; }

function getCourse(id) { return S.data.courses.find(c=>c.id===id)||null; }

function getHolePar(round, holeNum) {
  const c = getCourse(round.courseId);
  if (c && c.par) return c.par[holeNum-1] || 4;
  return 4;
}
function getHoleDist(round, holeNum) {
  const c = getCourse(round.courseId);
  if (!c) return 0;
  const tee = round.tee || 'blue';
  return (c.distances && c.distances[tee] && c.distances[tee][holeNum-1]) || 0;
}
function getHoleStrokeIndex(round, holeNum) {
  const c = getCourse(round.courseId);
  if (!c || !c.strokeIndex) return null;
  return c.strokeIndex[holeNum-1] || null;
}

function calcStrokesReceived(handicap, holesCount, strokeIndexRank) {
  const H = Math.max(0, toInt(handicap)||0);
  const holes = Math.max(1, toInt(holesCount)||18);
  const rank = toInt(strokeIndexRank);
  const base = Math.floor(H/holes);
  const rem  = H%holes;
  if (!rank || rank<1) return base;
  return base + (rank<=rem ? 1 : 0);
}

function calcStableford(par, gross, received) {
  const net = (toInt(gross)||0) - (toInt(received)||0);
  return Math.max(0, 2+(par-net));
}

function calcRoundScores(round) {
  if (!round || !round.holes) return {gross:0,nett:0,stableford:0,totalPar:0,scoreToPar:0,holesPlayed:0};
  const c = getCourse(round.courseId);
  const holesCount = c?.holes || round.holes.length || 18;
  let gross=0, totalPar=0, nett=0, stableford=0;
  round.holes.forEach(h => {
    const par = toInt(h.par)||0;
    const g   = toInt(h.score)||0;
    const si  = c ? toInt(c.strokeIndex?.[h.number-1]) : null;
    const rec = calcStrokesReceived(round.handicap, holesCount, si);
    gross     += g;
    totalPar  += par;
    nett      += (g - rec);
    stableford+= calcStableford(par, g, rec);
  });
  return {gross, nett, stableford, totalPar, scoreToPar: gross-totalPar, holesPlayed: round.holes.length};
}

function scoreToPar(score, par) {
  const diff = score - par;
  if (diff <= -2) return { label:'이글', cls:'chip-eagle' };
  if (diff === -1) return { label:'버디', cls:'chip-birdie' };
  if (diff ===  0) return { label:'파',   cls:'chip-par' };
  if (diff ===  1) return { label:'보기', cls:'chip-bogey' };
  if (diff ===  2) return { label:'더블', cls:'chip-double' };
  return { label: `+${diff}`, cls:'chip-triple' };
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function formatScoreToPar(diff) {
  if (diff===0) return 'E';
  return diff>0 ? `+${diff}` : String(diff);
}

// ════════════════════════════════════════════
// CADDIE ENGINE
// ════════════════════════════════════════════

// 세션 피드백 (이번 라운드 중 임시)
let sessionFeedback = {}; // { clubId: ['short'|'ok'|'long', ...] }

// 캐디 조건 상태 (홀마다 초기화)
// S.caddie = {
//   remainDist: '',        // 남은 거리 (필수)
//   wind: null,            // { dir:'head'|'tail'|'left'|'right', str:'weak'|'mid'|'strong' }
//   slope: null,           // { type:'up'|'down', deg:'slight'|'mid'|'steep' }
//   pin: null,             // 'front'|'mid'|'back'
//   hazard: null,          // { type:'bunker'|'water', dist: number }  그린 앞 위험
//   lastFeedback: null,    // 마지막 추천에 대한 피드백
//   openPanel: null        // 현재 열린 조건 패널
// }

function initCaddie() {
  S.caddie = {
    remainDist: '',
    wind: null,
    slope: null,
    pin: null,
    hazard: null,
    lastFeedback: null,
    openPanel: null
  };
}

// ── 피드백 기록 ──
function recordFeedback(clubId, result) {
  if (!LEARNING[clubId]) LEARNING[clubId] = { short:0, ok:0, long:0 };
  LEARNING[clubId][result]++;
  saveLearning();
  if (!sessionFeedback[clubId]) sessionFeedback[clubId] = [];
  sessionFeedback[clubId].push(result);
  if (S.caddie) S.caddie.lastFeedback = result;
}

// ── 클럽별 오늘 보정된 거리 ──
function getAdjustedDist(clubId) {
  const base = DISTANCES[clubId];
  if (!base || !base.total) return null;

  // 세션 피드백 우선
  const sf = sessionFeedback[clubId] || [];
  if (sf.length >= 2) {
    const shorts = sf.filter(x=>x==='short').length;
    const longs  = sf.filter(x=>x==='long').length;
    if (shorts >= 2 && shorts > longs) return base.total - 10;
    if (longs  >= 2 && longs  > shorts) return base.total + 10;
    return base.total;
  }

  // 누적 학습 데이터
  const l = LEARNING[clubId];
  if (!l || (l.short+l.ok+l.long) < 3) return base.total;
  const tot = l.short+l.ok+l.long;
  const bias = (l.long - l.short) / tot; // -1 ~ +1
  return Math.round(base.total + bias * 8);
}

// ── 오늘 전반적 경향 ──
function getSessionTendency() {
  const ironIds = ['4iron','5iron','6iron','7iron','8iron','9iron','pw','aw','sw','lw'];
  let shorts=0, oks=0, longs=0;
  ironIds.forEach(id => {
    (sessionFeedback[id]||[]).forEach(r => {
      if(r==='short') shorts++;
      else if(r==='ok') oks++;
      else if(r==='long') longs++;
    });
  });
  const total = shorts+oks+longs;
  if (total < 2) return null;
  if (shorts >= 2 && shorts > longs) return 'short';
  if (longs  >= 2 && longs  > shorts) return 'long';
  return 'ok';
}

// ── 환경 조건 보정값 계산 ──
function calcConditionAdj(caddie) {
  let adj = 0;
  const breakdown = []; // [{ label, delta }]

  // 바람
  if (caddie.wind) {
    const strMap = { weak:5, mid:10, strong:18 };
    const delta  = strMap[caddie.wind.str] || 0;
    const dir    = caddie.wind.dir;
    const dirLabel = { head:'맞바람', tail:'순풍', left:'좌측풍', right:'우측풍' }[dir];
    const strLabel = { weak:'약', mid:'중', strong:'강' }[caddie.wind.str];
    if (dir === 'head') {
      adj += delta;
      breakdown.push({ label: `🌬️ ${dirLabel}(${strLabel})`, delta: +delta });
    } else if (dir === 'tail') {
      adj -= delta;
      breakdown.push({ label: `🌬️ ${dirLabel}(${strLabel})`, delta: -delta });
    } else {
      // 옆바람: 절반만 보정
      const side = Math.round(delta * 0.4);
      adj += side;
      breakdown.push({ label: `🌬️ ${dirLabel}(${strLabel})`, delta: +side });
    }
  }

  // 경사
  if (caddie.slope) {
    const degMap = { slight:5, mid:10, steep:18 };
    const delta  = degMap[caddie.slope.deg] || 0;
    const typeLabel = caddie.slope.type === 'up' ? '오르막' : '내리막';
    const degLabel  = { slight:'약간', mid:'보통', steep:'급격' }[caddie.slope.deg];
    if (caddie.slope.type === 'up') {
      adj += delta;
      breakdown.push({ label: `⛰️ ${typeLabel}(${degLabel})`, delta: +delta });
    } else {
      // 내리막은 비대칭 (덜 줄어듦)
      const downDelta = Math.round(delta * 0.7);
      adj -= downDelta;
      breakdown.push({ label: `⛰️ ${typeLabel}(${degLabel})`, delta: -downDelta });
    }
  }

  // 핀 위치
  if (caddie.pin) {
    const pinMap = { front: -5, mid: 0, back: +7 };
    const pinLabel = { front:'앞쪽', mid:'중간', back:'뒤쪽' }[caddie.pin];
    const delta = pinMap[caddie.pin];
    if (delta !== 0) {
      adj += delta;
      breakdown.push({ label: `📍 핀 ${pinLabel}`, delta });
    }
  }

  return { adj, breakdown };
}

// ── 메인 캐디 추천 함수 ──
function getCaddieRecommendation() {
  const caddie = S.caddie;
  if (!caddie) return null;
  const baseDist = toInt(caddie.remainDist);
  if (!baseDist || baseDist < 70) return null;

  // 조건 보정
  const { adj, breakdown } = calcConditionAdj(caddie);
  const targetDist = baseDist + adj;

  // 세션 경향 반영
  const tendency = getSessionTendency();

  // 클럽 후보 목록 (조정된 거리 기준)
  let candidates = CLUBS.map(c => {
    const adjD = getAdjustedDist(c.id);
    if (!adjD) return null;
    return { id: c.id, name: c.name, adjDist: adjD, diff: Math.abs(adjD - targetDist) };
  }).filter(Boolean).sort((a,b) => a.diff - b.diff);

  if (!candidates.length) return null;

  let recommended = candidates[0];
  let tendencyNote = null;

  // 세션 경향으로 1클럽 보정
  if (tendency === 'short') {
    const up = candidates.find(c => c.adjDist > recommended.adjDist);
    if (up) { recommended = up; tendencyNote = '오늘 거리 짧음 → 한 클럽 ↑'; }
  } else if (tendency === 'long') {
    const down = candidates.find(c => c.adjDist < recommended.adjDist);
    if (down) { recommended = down; tendencyNote = '오늘 거리 길음 → 한 클럽 ↓'; }
  }

  // 위험 요소 분석
  let hazardWarning = null;
  let hazardSafe    = null;
  if (caddie.hazard && caddie.hazard.dist) {
    const hDist  = toInt(caddie.hazard.dist);
    const hLabel = caddie.hazard.type === 'water' ? '워터해저드' : '벙커';
    if (hDist && hDist > 0) {
      const margin = targetDist - hDist;
      if (margin < 0) {
        // 추천 거리가 위험 요소에 못 미침
        hazardWarning = `⚠️ ${hLabel}까지 ${hDist}m — 추천 클럽이 위험 지점을 넘지 못할 수 있습니다. 한 클럽 올리거나 레이업을 고려하세요.`;
      } else if (margin < 8) {
        hazardWarning = `⚠️ ${hLabel}까지 ${hDist}m — 안전 마진이 ${margin}m로 부족합니다. 한 클럽 올리세요.`;
      } else {
        hazardSafe = `✅ ${hLabel}(${hDist}m) 충분히 넘김 · 여유 ${margin}m`;
      }
    }
  }

  return {
    club: recommended,
    baseDist,
    targetDist,
    breakdown,
    adj,
    tendencyNote,
    hazardWarning,
    hazardSafe
  };
}

// ════════════════════════════════════════════
// STATS CALCULATIONS
// ════════════════════════════════════════════

function calcStats(rounds) {
  const holes = rounds.flatMap(r => r.holes || []);
  const totalHoles = holes.length;
  if (totalHoles === 0) return null;

  // 평균 타수 (18홀 완성 라운드만)
  const fullRounds = rounds.filter(r => r.holes.length >= 18);
  const avgScore = fullRounds.length
    ? (fullRounds.reduce((s,r) => s + r.holes.reduce((a,h) => a+(toInt(h.score)||0),0), 0) / fullRounds.length).toFixed(1)
    : null;

  // 베스트/워스트
  const roundScores = fullRounds.map(r => r.holes.reduce((a,h)=>a+(toInt(h.score)||0),0));
  const best  = roundScores.length ? Math.min(...roundScores) : null;
  const worst = roundScores.length ? Math.max(...roundScores) : null;

  // FIR (파4/5만)
  const firHoles = holes.filter(h => (h.par===4||h.par===5) && h.fairway !== null && h.fairway !== undefined);
  const firHits  = firHoles.filter(h => h.fairway === 'hit').length;
  const firPct   = firHoles.length ? Math.round(firHits/firHoles.length*100) : null;

  // GIR
  const girHoles = holes.filter(h => h.gir !== null && h.gir !== undefined);
  const girHits  = girHoles.filter(h => h.gir === true).length;
  const girPct   = girHoles.length ? Math.round(girHits/girHoles.length*100) : null;

  // 퍼팅
  const puttHoles = holes.filter(h => h.putts !== null && h.putts !== undefined);
  const totalPutts = puttHoles.reduce((s,h) => s+(toInt(h.putts)||0),0);
  const avgPutts = puttHoles.length ? (totalPutts/puttHoles.length).toFixed(1) : null;
  const threePutt = puttHoles.filter(h => (toInt(h.putts)||0) >= 3).length;

  // 파세이브율 (GIR 미스 후 파 이상)
  const nonGirHoles = holes.filter(h => h.gir === false && h.score !== null && h.par !== null);
  const parSaves    = nonGirHoles.filter(h => (toInt(h.score)||99) <= h.par).length;
  const parSavePct  = nonGirHoles.length ? Math.round(parSaves/nonGirHoles.length*100) : null;

  // 스크램블링율 (파온 못했는데 파 이상)
  const scrPct = parSavePct; // same definition here

  // 버디율
  const birdiePlus = holes.filter(h => (toInt(h.score)||99) < h.par).length;
  const birdieRate = totalHoles ? Math.round(birdiePlus/totalHoles*100) : null;

  // 스코어 분포
  const dist = { eagle:0, birdie:0, par:0, bogey:0, double:0, worse:0 };
  holes.forEach(h => {
    const d = (toInt(h.score)||0) - (h.par||4);
    if (d <= -2)    dist.eagle++;
    else if (d===-1) dist.birdie++;
    else if (d===0)  dist.par++;
    else if (d===1)  dist.bogey++;
    else if (d===2)  dist.double++;
    else             dist.worse++;
  });

  // 전반/후반 비교 (18홀 라운드)
  let frontAvg=null, backAvg=null;
  if (fullRounds.length) {
    const fronts = fullRounds.map(r => r.holes.slice(0,9).reduce((s,h)=>s+(toInt(h.score)||0),0));
    const backs  = fullRounds.map(r => r.holes.slice(9,18).reduce((s,h)=>s+(toInt(h.score)||0),0));
    frontAvg = (fronts.reduce((a,b)=>a+b,0)/fronts.length).toFixed(1);
    backAvg  = (backs.reduce((a,b)=>a+b,0)/backs.length).toFixed(1);
  }

  return { avgScore, best, worst, firPct, girPct, avgPutts, threePutt, parSavePct, birdieRate, dist, frontAvg, backAvg, totalHoles, fullRounds: fullRounds.length };
}

const app = document.getElementById('app');

function render() {
  app.innerHTML = '';

  // 모달 오버레이
  if (S.modal) {
    app.appendChild(renderModal());
    return;
  }

  // 라운드 진행 중
  if (S.activeRound) {
    app.appendChild(renderRoundPage());
    return;
  }

  // 일반 페이지
  const page = document.createElement('div');
  page.className = 'page';

  switch(S.page) {
    case 0: renderHome(page); break;
    case 1: renderRoundStart(page); break;
    case 2: renderStats(page); break;
    case 3: renderHistory(page); break;
    case 4: renderSettings(page); break;
  }

  app.appendChild(page);
  app.appendChild(renderNav());
}

function startRound() {
  const course = getCourse(S.selectedCourseId);
  if (!course) return;
  const raw = String(S.pendingHandicap||'').trim();
  if (raw==='') { alert('핸디캡을 입력해주세요.'); return; }
  const hcp = toInt(raw);
  if (hcp===null || hcp<0 || hcp>54) { alert('핸디캡은 0~54 범위로 입력해주세요.'); return; }

  const holeOrder = buildHoleOrder(course.holes||18, S.pendingStartHole||1);

  S.activeRound = {
    id: Date.now(),
    courseId: course.id,
    course: course.name,
    tee: S.selectedTee,
    startHole: holeOrder[0],
    holeOrder,
    handicap: hcp,
    date: new Date().toISOString(),
    holes: [],
    status: 'in-progress'
  };
  S.currentHole = holeOrder[0];
  S.holeStep = 'info';
  S.holeInput = { score: getHolePar({courseId: course.id, tee: S.selectedTee}, holeOrder[0]), putts:2, fairway:null, gir:null, remainDist:'' };
  sessionFeedback = {};
  initCaddie();

  history.pushState(null,'',location.href);
  render();
}

function buildHoleOrder(total, start) {
  if (total===9) return [1,2,3,4,5,6,7,8,9];
  if (start!==1 && start!==10) start=1;
  const o=[];
  for(let i=start;i<=total;i++) o.push(i);
  for(let i=1;i<start;i++) o.push(i);
  return o;
}

  const scoreChipLbl = scoreDiff <= -2 ? '이글↓' : scoreDiff === -1 ? '버디' : scoreDiff === 0 ? 'Par' : scoreDiff === 1 ? '보기' : scoreDiff === 2 ? '더블' : `+${scoreDiff}`;

function renderCaddiePanel(caddie) {
  const wrap = document.createElement('div');

  // 타이틀
  const title = document.createElement('div');
  title.className = 'caddie-title';
  title.innerHTML = `🏌️ 캐디`;

      type="number" inputmode="numeric" placeholder="남은 거리 (m)"

    <span style="font-size:14px; opacity:0.6; flex-shrink:0;">m</span>`;
  wrap.appendChild(distRow);

  window._caddieUpdate = () => { render(); };

  // 조건 토글 버튼들
  const toggles = document.createElement('div');
  toggles.className = 'condition-toggles';

  const conditions = [
    { key:'wind',   label:'🌬️ 바람',    active: !!caddie.wind },
    { key:'slope',  label:'⛰️ 경사',    active: !!caddie.slope },
    { key:'pin',    label:'📍 핀 위치',  active: !!caddie.pin },
    { key:'hazard', label:'⚠️ 위험 요소', active: !!caddie.hazard },
  ];

  conditions.forEach(cond => {
    const btn = document.createElement('button');
    btn.className = 'cond-toggle' + (caddie.openPanel===cond.key || cond.active ? ' active' : '');
    btn.textContent = cond.label + (cond.active ? ' ✓' : ' +');
    btn.onclick = () => {
      caddie.openPanel = caddie.openPanel === cond.key ? null : cond.key;
      render();
    };
    toggles.appendChild(btn);
  });

function completeHole() {
  const hi = S.holeInput;
  const round = S.activeRound;
  const holeNum = S.currentHole;
  const par = getHolePar(round, holeNum);

  if (hi.score === null) { alert('타수를 입력해주세요.'); return; }
  if (hi.putts === null) { alert('퍼팅 수를 입력해주세요.'); return; }
  if ((par===4||par===5) && hi.fairway === null) { alert('페어웨이 안착 여부를 선택해주세요.'); return; }
  if (hi.gir === null) { alert('파온 여부를 선택해주세요.'); return; }

  const holeData = {
    number: holeNum,
    par,
    score: hi.score,
    putts: hi.putts,
    fairway: (par===4||par===5) ? hi.fairway : null,
    gir: hi.gir,
  };

  round.holes.push(holeData);
  saveData();
  autoSave();

  // 다음 홀 또는 종료
  const totalHoles = round.holeOrder.length;
  if (round.holes.length >= totalHoles) {
    finishRound();
    return;
  }

  const nextIdx = round.holes.length;
  S.currentHole = round.holeOrder[nextIdx];
  S.holeStep = 'info';
  const nextPar = getHolePar(round, S.currentHole);
  S.holeInput = { score: nextPar, putts:2, fairway:null, gir:null, remainDist:'' };
  initCaddie();
  render();
}

function finishRound() {
  S.activeRound.status = 'completed';
  S.data.rounds.push(S.activeRound);
  saveData();
  localStorage.removeItem(TEMP_KEY);

  const summaryRound = S.activeRound;
  S.modal = 'summary';
  S.modalData = { round: summaryRound };
  render();
}

      ${st.girPct!==null ? `<div class="stat-card"><div class="stat-val">${st.girPct}%</div><div class="stat-lbl">GIR</div><div class="stat-sub">파온율</div></div>` : ''}
      ${st.avgPutts!==null ? `<div class="stat-card"><div class="stat-val">${st.avgPutts}</div><div class="stat-lbl">평균 퍼팅</div><div class="stat-sub">홀당</div></div>` : ''}
      ${st.threePutt!==null ? `<div class="stat-card"><div class="stat-val">${st.threePutt}</div><div class="stat-lbl">3퍼팅</div><div class="stat-sub">${st.totalHoles}홀 중</div></div>` : ''}

      ${st.birdieRate!==null ? `<div class="stat-card"><div class="stat-val">${st.birdieRate}%</div><div class="stat-lbl">버디율</div></div>` : ''}
    </div>`;
  el.appendChild(card1);

  // 전반/후반
  if (st.frontAvg && st.backAvg) {
    const card2 = document.createElement('div');
    card2.className = 'card';
    card2.innerHTML = `
      <div class="section-title">전반 / 후반</div>
      <div class="row-list">
        <div class="row-item"><span class="row-label">전반 (1~9홀) 평균</span><span class="row-value">${st.frontAvg}</span></div>
        <div class="row-item"><span class="row-label">후반 (10~18홀) 평균</span><span class="row-value">${st.backAvg}</span></div>
        <div class="row-item"><span class="row-label">전/후반 차이</span><span class="row-value">${(parseFloat(st.backAvg)-parseFloat(st.frontAvg)).toFixed(1)}</span></div>
      </div>`;
    el.appendChild(card2);
  }

  // 스코어 분포
  if (st.dist) {
    const card3 = document.createElement('div');
    card3.className = 'card';
    const total = st.totalHoles;
    const pct = v => total ? Math.round(v/total*100) : 0;
    const items = [
      { label:'이글 이하', val:st.dist.eagle,  color:'#d35400' },
      { label:'버디',      val:st.dist.birdie, color:'#1e8449' },
      { label:'파',        val:st.dist.par,    color:'#2471a3' },
      { label:'보기',      val:st.dist.bogey,  color:'#b7950b' },
      { label:'더블보기',  val:st.dist.double, color:'#c0392b' },
      { label:'트리플+',   val:st.dist.worse,  color:'#922b21' },

  // 스코어 트렌드 (최근 10라운드)
  const trend10 = completed.slice(-10);
  if (trend10.length >= 2) {
    const scores = trend10.map(r => r.holes.reduce((s,h)=>s+(toInt(h.score)||0),0));
    const minS = Math.min(...scores), maxS = Math.max(...scores);
    const range = maxS - minS || 1;
    const card4 = document.createElement('div');
    card4.className = 'card';
    card4.innerHTML = `
      <div class="section-title">스코어 트렌드</div>
      <div class="trend-dots">

          const isBest = s===minS;
          return `<div class="trend-dot-wrap" style="justify-content:flex-end;">
            <div class="trend-dot${isBest?' best':''}" style="margin-bottom:${Math.round(((s-minS)/range)*60)}px;"></div>
            <div class="trend-lbl">${s}</div>
          </div>`;
        }).join('')}
      </div>`;
    el.appendChild(card4);
  }
}

function renderModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  switch(S.modal) {
    case 'finish':         overlay.appendChild(renderFinishModal()); break;
    case 'summary':        overlay.appendChild(renderSummaryModal()); break;
    case 'roundDetail':    overlay.appendChild(renderRoundDetailModal()); break;
    case 'courseEdit':     overlay.appendChild(renderCourseEditModal()); break;
    case 'recovery':       overlay.appendChild(renderRecoveryModal()); break;
    default: S.modal=null; return document.createTextNode('');
  }

  overlay.onclick = (e) => {
    if (e.target === overlay && S.modal !== 'recovery') { S.modal=null; render(); }
  };
  return overlay;
}

function renderRoundDetailModal() {
  const r = S.modalData.round;
  const sc = calcRoundScores(r);
  const nettDiff = sc.nett - sc.totalPar;

  // 홀별 통계
  const holes = r.holes || [];
  const firHoles = holes.filter(h=>(h.par===4||h.par===5)&&h.fairway!==null);
  const firPct = firHoles.length ? Math.round(firHoles.filter(h=>h.fairway==='hit').length/firHoles.length*100) : null;
  const girHoles = holes.filter(h=>h.gir!==null);
  const girPct = girHoles.length ? Math.round(girHoles.filter(h=>h.gir===true).length/girHoles.length*100) : null;
  const totalPutts = holes.reduce((s,h)=>s+(toInt(h.putts)||0),0);
  const avgPutts = holes.length ? (totalPutts/holes.length).toFixed(1) : null;
  const threePutt = holes.filter(h=>(toInt(h.putts)||0)>=3).length;
  const nonGir = holes.filter(h=>h.gir===false);
  const parSaves = nonGir.filter(h=>(toInt(h.score)||99)<=h.par).length;
  const parSavePct = nonGir.length ? Math.round(parSaves/nonGir.length*100) : null;

  let holesHtml = holes.map(h => {
    const diff = (toInt(h.score)||0) - h.par;

    <div class="modal-title">${esc(r.course)}</div>
    <div class="text-sm text-center" style="margin-bottom:16px;">${formatDate(r.date)} · ${r.tee==='blue'?'🔵 Blue':'⚪ White'} · HCP ${r.handicap}</div>

      ${girPct!==null?`<div class="stat-card"><div class="stat-val">${girPct}%</div><div class="stat-lbl">GIR</div></div>`:''}

window.handleBackupRestore = function(e) {
  const file = e?.target?.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      let parsed = JSON.parse(ev.target.result);
      const incoming = parsed.data || parsed;
      if (!Array.isArray(incoming.rounds) || !Array.isArray(incoming.courses)) {
        alert('백업 파일 형식이 올바르지 않습니다.'); return;
      }
      if (!confirm('복원하면 현재 데이터가 교체됩니다. 진행할까요?')) return;
      incoming.courses.forEach(c => {
        if (!c.strokeIndex?.length) c.strokeIndex = Array.from({length:c.holes||18},(_,i)=>i+1);
      });
      S.data = incoming;
      saveData(); alert('복원 완료!'); render();
    } catch(err) { alert('파일을 읽을 수 없습니다.'); }
  };
  reader.readAsText(file,'utf-8');
  e.target.value='';
};

async function fileToBase64(file) {
  const MAX_DIM=2000, QUALITY=0.82;
  const type=(file?.type||'').toLowerCase();
  const isHeic=type.includes('heic')||type.includes('heif');
  try {
    if (!isHeic && file.size<=900*1024 && (type==='image/jpeg'||type==='image/png'||type==='image/webp')) {
      return { base64Data: await _readFileAsBase64(file), mimeType: type||'image/jpeg' };
    }
  } catch(_) {}
  let bitmap;
  try {
    if ('createImageBitmap' in window) bitmap=await createImageBitmap(file);
    else { const url=await _readFileAsDataUrl(file); const img=await _loadImage(url); bitmap=img; }
  } catch(e) {
    if (isHeic) throw new Error('HEIC 파일은 지원되지 않습니다.\n스크린샷으로 저장 후 업로드해주세요.');
    throw new Error('이미지를 열 수 없습니다.');
  }
  const sw=bitmap.width||bitmap.naturalWidth||0, sh=bitmap.height||bitmap.naturalHeight||0;
  if (!sw||!sh) throw new Error('이미지 크기를 확인할 수 없습니다.');
  const scale=Math.min(1,MAX_DIM/Math.max(sw,sh));
  const ow=Math.max(1,Math.round(sw*scale)), oh=Math.max(1,Math.round(sh*scale));
  const canvas=document.createElement('canvas'); canvas.width=ow; canvas.height=oh;
  const ctx=canvas.getContext('2d',{alpha:false});
  if (!ctx) throw new Error('브라우저에서 이미지 변환을 지원하지 않습니다.');
  ctx.drawImage(bitmap,0,0,ow,oh);
  try { if(bitmap.close) bitmap.close(); } catch(_) {}
  const blob=await _canvasToBlob(canvas,'image/jpeg',QUALITY);
  return { base64Data: await _readBlobAsBase64(blob), mimeType:'image/jpeg' };
}

async function callClaudeVision(apiKey, base64Data, mimeType) {
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),60000);
  const sys=`You are a golf scorecard analyzer. Extract course information and return ONLY valid JSON (no markdown, no backticks):\n{"name":"Course Name","location":"City","holes":18,"par":[4,3,5...],"distances_blue":[...],"distances_white":[...],"stroke_index":[...]}\nRules: par=3/4/5 per hole, distances in meters or yards as shown, stroke_index=handicap index 1-18, 0 for unknown distances, 4 for unknown par. Return ONLY the JSON.`;
  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2048,system:sys,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mimeType||'image/jpeg',data:base64Data}},
          {type:'text',text:'이 스코어카드에서 코스 정보를 추출해서 JSON으로 반환해 주세요.'}
        ]}]}),
      signal:ctrl.signal
    });
    if (!res.ok) {
      const e=await res.json().catch(()=>({}));
      if (res.status===401) throw new Error('API Key가 유효하지 않습니다.');
      if (res.status===429) throw new Error('API 요청 한도 초과입니다. 잠시 후 다시 시도해주세요.');
      throw new Error('Claude API 오류: '+res.status+'\n'+(e.error?.message||''));
    }
    const result=await res.json();
    const text=result.content.filter(c=>c.type==='text').map(c=>c.text).join('');
    const cleaned=text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
    try { return JSON.parse(cleaned); }
    catch(_) {
      const m=cleaned.match(/\{[\s\S]*\}/);
      if (m) return JSON.parse(m[0]);
      throw new Error('AI 응답을 파싱할 수 없습니다.');
    }
  } catch(e) {
    if (e?.name==='AbortError') throw new Error('응답 시간이 초과되었습니다. (60초)\n다시 시도해주세요.');
    throw e;
  } finally { clearTimeout(t); }
}

function fillCourseFromAI(data) {
  const holes=data.holes||18;
  let par=data.par||[], distB=data.distances_blue||[], distW=data.distances_white||[];
  const rawIdx=data.stroke_index??data.strokeIndex??data.handicap??data.hcp??[];
  let si=Array.isArray(rawIdx)?rawIdx:[];
  while(par.length<holes) par.push(4);
  while(distB.length<holes) distB.push(0);
  while(distW.length<holes) distW.push(0);
  while(si.length<holes) si.push(si.length+1);
  S.editingCourse = {
    id:'course_'+Date.now(), name:data.name||'', location:data.location||'',
    holes, par:par.slice(0,holes), strokeIndex:si.slice(0,holes),
    distances:{blue:distB.slice(0,holes), white:distW.slice(0,holes)}
  };
  S.modal='courseEdit';
  render();
}

function _readFileAsBase64(file) {
  return new Promise((res,rej) => {
    const r=new FileReader();
    r.onload=()=>{ const s=String(r.result||''); const i=s.indexOf(','); res(i>=0?s.slice(i+1):s); };
    r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다.'));
    r.readAsDataURL(file);
  });
}
function _readFileAsDataUrl(file) {
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=()=>rej(new Error('파일 읽기 실패'));r.readAsDataURL(file);});
}
function _loadImage(src) {
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('이미지 로드 실패'));img.src=src;});
}
function _canvasToBlob(canvas,mime,q) {
  return new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('변환 실패')),mime,q));
}
function _readBlobAsBase64(blob) {
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||'');const i=s.indexOf(',');res(i>=0?s.slice(i+1):s);};r.onerror=()=>rej(new Error('읽기 실패'));r.readAsDataURL(blob);});
}
